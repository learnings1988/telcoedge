spring:
  application:
    name: charging-engine
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/telcoedge
    username: telcoedge
    password: telcoedge_dev
    hikari:
      pool-name: charging-engine-pool
      max-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        generate_statistics: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
          default_batch_fetch_size: 25
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 25
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: true

    open_in_view: false
  lifecycle:
    timeout-per-shutdown-phase: 25s

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081
  shutdown: graceful

logging:
  level:
    root: INFO
    #com.telcoedge: DEBUG
    #org.hibernate.SQL: DEBUG
    #org.hibernate.stat: DEBUG
    #org.hibernate.orm.jdbc.bind: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,charging

        liveness:
          include:
            - livenessState
  metrics:
    tags:
      application: charging-engine
  health:
    circuitbreakers:
      enabled: true


resilience4j:
  circuitbreaker:
    instances:
      subscriberLookup:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: count_based
        register-health-indicator: true
  retry:
    instances:
      subscriberLookup:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.QueryTimeoutException
          - org.springframework.dao.TransientDataAccessResourceException
        ignore-exceptions:
          - org.springframework.dao.EmptyResultDataAccessException
  ratelimiter:
    instances:
      chargingEndpoint:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0s
        register-health-indicator: true

telcoedge:
  outbox:
    poller:
      enabled: true
      fixed-delay-ms: 1000
      batch-size: 50
