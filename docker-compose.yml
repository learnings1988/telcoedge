services:
  postgres:
    image: postgres:16-alpine
    container_name: telcoedge-postgres
    environment:
      POSTGRES_DB: telcoedge
      POSTGRES_USER: telcoedge
      POSTGRES_PASSWORD: telcoedge_dev
    ports:
      # Host 5433 avoids conflict with local PostgreSQL 17 on Windows (often uses 5432).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telcoedge"]
      interval: 5s
      timeout: 3s
      retries: 5

  subscriber-api:
    build:
      context: .
      dockerfile: subscriber-api/Dockerfile
    container_name: telcoedge-subscriber-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/telcoedge
      SPRING_DATASOURCE_USERNAME: telcoedge
      SPRING_DATASOURCE_PASSWORD: telcoedge_dev
    ports:
      - "8080:8080"

  kafka:
    image: apache/kafka:3.7.0
    container_name: telcoedge-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFAK_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs


volumes:
  postgres_data: