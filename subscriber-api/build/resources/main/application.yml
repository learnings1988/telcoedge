spring:
  application:
    name: subscriber-api
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/public.pem
  lifecycle:
    timeout-per-shutdown-phase: 25s

  flyway:
    enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db
        liveness:
          include:
            - livenessState

logging:
  level:
    root: INFO
    com.telcoedge: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    org.springframework.security: DEBUG