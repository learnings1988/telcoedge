# Prod Profile - environment variables for secrets, minimal logging
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: subscriber-api-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false

  flyway:
    enabled: true


logging:
  level:
    root: WARN
    com.telcoedge: INFO
    org.hibernate.sql: WARN

